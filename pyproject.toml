[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "das"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
das = "das.cli:main"

[tool.setuptools]
packages = ["das", "api"]
